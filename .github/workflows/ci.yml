name: CI (Paridade macOS & Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gofmt (Formatting Gate)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Native Binary
        run: make build

      - name: Smoke Test (Doctor, Version, Self-Healing & JSON)
        run: |
          ./bin/agyo version
          ./bin/agyo doctor
          ./bin/agyo doctor --json
          ./bin/agyo doctor --fix
          ./bin/agyo init test-workspace
          ./bin/agyo session status --json test-workspace
          ./bin/agyo checkpoint "ci-test" test-workspace
          ./bin/agyo checkpoint --list --json test-workspace

      - name: Cross-Compilation Test
        run: make build-linux
