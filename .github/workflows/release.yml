name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build & Package Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # Sigstore signing for build provenance
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Cross-Platform Static Binaries
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          # Darwin (macOS)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/agyo_darwin_arm64 ./cmd/agyo
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/agyo_darwin_amd64 ./cmd/agyo
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/agyo_linux_amd64 ./cmd/agyo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/agyo_linux_arm64 ./cmd/agyo
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/agyo_windows_amd64.exe ./cmd/agyo

          # Package archives
          cd dist
          tar -czf agyo_darwin_arm64.tar.gz agyo_darwin_arm64
          tar -czf agyo_darwin_amd64.tar.gz agyo_darwin_amd64
          tar -czf agyo_linux_amd64.tar.gz agyo_linux_amd64
          tar -czf agyo_linux_arm64.tar.gz agyo_linux_arm64
          zip agyo_windows_amd64.zip agyo_windows_amd64.exe
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          cd ..

      - name: Smoke Test Injected Version
        run: |
          out="$(./dist/agyo_linux_amd64 version)"
          echo "$out"
          case "$out" in
            *"v${GITHUB_REF_NAME#v}"*|*"vdev-"*) ;;
            *) echo "version not injected"; exit 1 ;;
          esac

      - name: Attest Build Provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  bump-tap:
    name: Open Homebrew Tap Bump PR
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fine-grained PAT with Contents + Pull requests (read/write) on
      # tiagovilasboas/homebrew-tap. Without it this job only logs a notice.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip Without HOMEBREW_TAP_TOKEN
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap Formula bump PR."

      - name: Checkout Code
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Open Tap Formula Bump PR
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/bump-tap-formula.sh
